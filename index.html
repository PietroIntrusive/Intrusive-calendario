 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALENDÁRIO — LANÇAMENTO DA MARCA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg: #0a0a0a; --bg2: #111111; --bg3: #1a1a1a;
    --red: #e63022; --orange: #ff6b1a; --white: #f0ece4;
    --gray: #888; --gray2: #444; --done: #2d6a2d;
    --done-text: #5cdb5c; --border: #2a2a2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--white); font-family: 'Space Mono', monospace; min-height: 100vh; overflow-x: hidden; }

  /* HEADER */
  .header { padding: 40px 40px 20px; border-bottom: 1px solid var(--border); position: relative; }
  .brand-title { font-family: 'Bebas Neue'; font-size: clamp(36px, 6vw, 72px); letter-spacing: 4px; line-height: 1; }
  .brand-title span { color: var(--red); }
  .progress-bar-wrap { width: 220px; height: 6px; background: var(--bg3); border: 1px solid var(--border); }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--orange)); transition: 0.5s; width: 0%; }

  /* MAIN E SIDEBAR */
  .main { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 200px); }
  .sidebar { border-right: 1px solid var(--border); padding: 30px 24px; position: sticky; top: 0; height: calc(100vh - 100px); overflow-y: auto; }

  /* ESTILO APPLE GLASS (O QUE VOCÊ PEDIU) */
  .glass-panel {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 20px;
    margin-top: 25px;
    transition: 0.3s;
  }
  .glass-panel:hover { transform: translateY(-5px); border: 1px solid rgba(230, 48, 34, 0.4); }

  .activity-item { border-left: 2px solid var(--red); padding-left: 10px; margin-bottom: 15px; font-size: 11px; }

  /* CALENDÁRIO */
  .calendar-area { padding: 30px; }
  .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day-cell { aspect-ratio: 1; background: var(--bg2); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; }
  .day-cell.selected { border-color: var(--orange); background: rgba(255,107,26,0.1); }
  .day-cell.done { background: rgba(45,106,45,0.2); border-color: var(--done-text); }
  .day-num { font-family: 'Bebas Neue'; font-size: 22px; }

  .mark-btn { display: block; width: 100%; padding: 14px; background: var(--red); color: white; border: none; font-family: 'Bebas Neue'; font-size: 18px; cursor: pointer; margin-top: 15px; }
  .mark-btn.is-done { background: var(--done); color: var(--done-text); }
  .notes-input { width: 100%; height: 100px; background: #000; border: 1px solid var(--border); color: white; padding: 10px; font-family: inherit; font-size: 12px; margin-top: 10px; resize: none; }

  @media (max-width: 768px) { .main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
    <div>
      <div class="brand-title">ROAD TO<span> LAUNCH</span></div>
      <div style="font-size:12px; color:var(--gray); letter-spacing:4px; text-transform:uppercase;">Intrusive Workflow</div>
    </div>
    <div style="text-align:right;">
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div style="font-family:'Bebas Neue'; margin-top:6px;"><span id="doneCount">0</span> / <span id="totalCount">0</span> DIAS</div>
    </div>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div style="font-family:'Bebas Neue'; color:var(--red); border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:15px;">ROTINA DIÁRIA</div>
    <div id="selDayDate" style="font-family:'Bebas Neue'; font-size:36px;">--/--</div>
    
    <div id="scheduleBlock" style="margin-top:20px;"></div>

    <div style="margin-top:30px; border-top:1px solid var(--border); padding-top:15px;">
      <div style="font-size:10px; color:var(--gray); letter-spacing:2px;">OBSERVAÇÕES</div>
      <textarea id="dayNotes" class="notes-input" placeholder="O que aconteceu hoje?"></textarea>
      <button class="mark-btn" onclick="saveData()" style="font-size:12px; background:var(--gray2); padding:8px;">SALVAR NOTA</button>
    </div>

    <button class="mark-btn" id="markBtn" onclick="toggleStatus()" style="display:none">MARCAR CONCLUÍDO</button>

    <div class="glass-panel">
      <div style="font-size:10px; color:var(--white); margin-bottom:15px; font-weight:bold;">ATIVIDADE RECENTE</div>
      <div id="recentActivity">
        <div style="font-size:11px; color:var(--gray);">Nenhuma nota recente.</div>
      </div>
    </div>
  </div>

  <div class="calendar-area" id="calendarArea"></div>
</div>

<script>
// --- CONFIGURAÇÃO DO SUPABASE ---
// COLOQUE SEUS DADOS AQUI EMBAIXO:
const SB_URL = 'https://xebtpqjcpeatxkxmijgw.supabase.co'; 
const SB_KEY = ' sb_publishable_CxfVXlt7AwSAOQHDkRAS4Q_QmGM0H3z';
const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

const START_DATE = '2026-05-12';
const END_DATE = '2026-07-12';
let selectedDate = '2026-05-12';
let dbData = {};

// Função INIT: O comando que liga tudo
async function init() {
  await fetchAll();       // 1. Busca os dados no banco
  renderCalendar();     // 2. Desenha os quadradinhos do calendário
  selectDay(selectedDate); // 3. Mostra o dia inicial
  updateActivityPanel(); // 4. Atualiza o painel de vidro
}

async function fetchAll() {
  const { data } = await supabaseClient.from('calendar_data').select('*');
  dbData = {};
  data?.forEach(d => dbData[d.date_id] = d);
}

function renderCalendar() {
  const area = document.getElementById('calendarArea');
  area.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'days-grid';
  
  let curr = new Date(START_DATE + 'T00:00:00');
  const end = new Date(END_DATE + 'T00:00:00');
  let total = 0; let done = 0;

  while(curr <= end) {
    const ds = curr.toISOString().split('T')[0];
    const isDone = dbData[ds]?.is_done || false;
    if(ds >= START_DATE && ds <= END_DATE) total++;
    if(isDone) done++;

    const cell = document.createElement('div');
    cell.className = `day-cell ${isDone ? 'done' : ''} ${selectedDate === ds ? 'selected' : ''}`;
    cell.innerHTML = `<div class="day-num">${curr.getDate()}</div>`;
    cell.onclick = () => selectDay(ds);
    grid.appendChild(cell);
    curr.setDate(curr.getDate() + 1);
  }
  area.appendChild(grid);
  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('progressFill').style.width = (done/total*100) + '%';
}

function selectDay(ds) {
  selectedDate = ds;
  const data = dbData[ds] || { note_text: '', is_done: false };
  document.getElementById('selDayDate').textContent = ds.split('-').reverse().slice(0,2).join('/');
  document.getElementById('dayNotes').value = data.note_text || '';
  
  const btn = document.getElementById('markBtn');
  btn.style.display = 'block';
  btn.textContent = data.is_done ? '✓ DESMARCAR DIA' : 'MARCAR COMO CONCLUÍDO';
  btn.className = data.is_done ? 'mark-btn is-done' : 'mark-btn';

  document.querySelectorAll('.day-cell').forEach(c => c.classList.remove('selected'));
}

function updateActivityPanel() {
  const activityDiv = document.getElementById('recentActivity');
  const items = Object.values(dbData)
    .filter(d => d.note_text)
    .sort((a, b) => b.date_id.localeCompare(a.date_id))
    .slice(0, 3);

  if (items.length > 0) {
    activityDiv.innerHTML = items.map(i => `
      <div class="activity-item">
        <div style="color:var(--white); font-weight:bold;">DIA ${i.date_id.split('-').reverse().join('/')}</div>
        <div style="font-style:italic; color:var(--gray);">"${i.note_text.substring(0, 30)}..."</div>
      </div>
    `).join('');
  }
}

async function saveData() {
  const note = document.getElementById('dayNotes').value;
  const isDone = dbData[selectedDate]?.is_done || false;
  await supabaseClient.from('calendar_data').upsert({ date_id: selectedDate, note_text: note, is_done: isDone });
  await fetchAll();
  renderCalendar();
  updateActivityPanel();
  alert("Nota Salva!");
}

async function toggleStatus() {
  const current = dbData[selectedDate]?.is_done || false;
  await supabaseClient.from('calendar_data').upsert({ 
    date_id: selectedDate, is_done: !current, note_text: document.getElementById('dayNotes').value
  });
  await fetchAll();
  renderCalendar();
  selectDay(selectedDate);
  updateActivityPanel();
}

init();
</script>
</body>
</html>
