<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTRUSIVE — COMMAND CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-deep: #050505; --red: #e63022; --orange: #ff6b1a; --white: #f0ece4; --gray: #666; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body { background: var(--bg-deep); color: var(--white); font-family: 'Barlow Condensed', sans-serif; min-height: 100vh; overflow-x: hidden; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(50px); }
        .login-card { background: var(--glass); padding: 50px; border-radius: 30px; border: 1px solid var(--border); text-align: center; max-width: 450px; width: 90%; }
        .header { padding: 50px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .intrusive-brand { font-weight: 900; font-size: 85px; color: var(--red); line-height: 0.7; letter-spacing: -2px; }
        .master-layout { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 180px); }
        .activity-sidebar { border-right: 1px solid var(--border); padding: 30px; overflow-y: auto; }
        .calendar-container { padding: 40px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; overflow-y: auto; }
        .day-cell { aspect-ratio: 1; background: var(--glass); border: 1px solid var(--border); padding: 15px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .day-cell:hover { border-color: var(--red); transform: translateY(-5px); }
        .btn-premium { background: var(--red); color: white; border: none; padding: 12px 25px; border-radius: 12px; font-family: 'Bebas Neue'; font-size: 18px; cursor: pointer; }
        .expansion-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(35px); z-index: 5000; display: none; padding: 60px; justify-content: center; align-items: center; opacity: 0; transition: 0.6s; }
        .expansion-overlay.show { display: flex; opacity: 1; }
        .task-card { background: var(--glass); border-radius: 20px; padding: 25px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; align-items: center; gap: 20px; }
        .check-box { width: 28px; height: 28px; border: 2px solid var(--red); border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body id="dynamicBody">
    <div id="loginOverlay">
        <div class="login-card">
            <div class="intrusive-brand" style="font-size: 60px; margin-bottom: 10px;">INTRUSIVE</div>
            <input type="text" id="userName" placeholder="NOME" style="width: 100%; background: transparent; border-bottom: 2px solid var(--red); color: white; font-size: 24px; text-align: center; margin-bottom: 20px; outline: none; font-family: 'Bebas Neue';">
            <input type="text" id="userAvatar" placeholder="LINK FOTO (URL)" style="width: 100%; background: transparent; border-bottom: 1px solid var(--gray); color: white; font-size: 14px; text-align: center; margin-bottom: 40px; outline: none;">
            <button class="btn-premium" onclick="initCommandCenter()">INICIAR SESSÃO</button>
        </div>
    </div>
    <div class="header">
        <div class="intrusive-brand" style="font-size: 40px;">INTRUSIVE</div>
        <div id="presenceBar" style="display: flex; gap: 10px;"></div>
    </div>
    <div class="master-layout">
        <div class="activity-sidebar"><div id="logContainer"></div></div>
        <div class="calendar-container" id="calendarGrid"></div>
    </div>
    <div id="dayExpansion" class="expansion-overlay" onclick="closeDay()">
        <div class="expansion-content" onclick="event.stopPropagation()" style="width: 100%; max-width: 800px; background: #000; padding: 40px; border-radius: 20px;">
            <div id="exDate" style="font-family: 'Bebas Neue'; font-size: 100px; color: var(--red);">--/--</div>
            <div id="taskList"></div>
            <button class="btn-premium" onclick="createNewTask()">+ TAREFA</button>
        </div>
    </div>
    <script>
        const SB_URL = 'https://xebtpqjcpeatxkxmijgw.supabase.co';
        const SB_KEY = 'sb_publishable_CxfVXlt7AwSAOQHDkRAS4Q_QmGM0H3z';
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);
        let user = { name: '', photo: '', start: Date.now() };
        let currentDay = '';
        let dataCache = { tasks: [], presence: [] };

        async function initCommandCenter() {
            const name = document.getElementById('userName').value.trim();
            if(!name) return alert("Digite seu nome.");
            user.name = name;
            user.photo = document.getElementById('userAvatar').value.trim() || `https://ui-avatars.com/api/?name=${name}&background=e63022&color=fff`;
            document.getElementById('loginOverlay').style.display = 'none';
            await loadInitialData();
            renderCalendar();
            setInterval(heartbeat, 15000);
        }

        async function loadInitialData() {
            const { data: t } = await supabase.from('tasks').select('*');
            const { data: p } = await supabase.from('team_presence').select('*');
            dataCache.tasks = t || [];
            dataCache.presence = p || [];
            updateUI();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            for(let i = 12; i <= 42; i++) {
                const d = i > 31 ? i - 31 : i;
                const m = i > 31 ? '06' : '05';
                const ds = `2026-${m}-${String(d).padStart(2, '0')}`;
                const div = document.createElement('div');
                div.className = 'day-cell';
                div.innerHTML = `<div style="font-size: 24px; color: var(--red);">${d}</div><div>${m}/26</div>`;
                div.onclick = () => { currentDay = ds; document.getElementById('exDate').innerText = d+'/'+m; document.getElementById('dayExpansion').classList.add('show'); renderTasks(); };
                grid.appendChild(div);
            }
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = dataCache.tasks.filter(t => t.date_id === currentDay).map(t => `<div class="task-card"><div>${t.task_text}</div></div>`).join('');
        }

        async function createNewTask() {
            const txt = prompt("Tarefa:");
            if(txt) await supabase.from('tasks').insert({ date_id: currentDay, task_text: txt, created_by: user.name });
            loadInitialData().then(renderTasks);
        }

        function closeDay() { document.getElementById('dayExpansion').classList.remove('show'); }

        async function heartbeat() {
            await supabase.from('team_presence').upsert({ user_name: user.name, avatar_url: user.photo, is_online: true, last_seen: new Date().toISOString() });
            loadInitialData();
        }

        function updateUI() {
            document.getElementById('presenceBar').innerHTML = dataCache.presence.map(p => `<img src="${p.avatar_url}" style="width:30px; border-radius:50%; border: 2px solid ${p.is_online ? '#5cdb5c' : '#444'}">`).join('');
        }
    </script>
</body>
</html>
