 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALENDÁRIO — LANÇAMENTO DA MARCA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0a0a; --bg2: #111111; --bg3: #1a1a1a;
    --red: #e63022; --orange: #ff6b1a; --white: #f0ece4;
    --gray: #888; --gray2: #444; --done: #2d6a2d;
    --done-text: #5cdb5c; --border: #2a2a2a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--white); font-family: 'Space Mono', monospace; min-height: 100vh; overflow-x: hidden; }

  /* HEADER ORIGINAL */
  .header { padding: 40px 40px 20px; border-bottom: 1px solid var(--border); position: relative; }
  .brand-title { font-family: 'Bebas Neue'; font-size: clamp(36px, 6vw, 72px); letter-spacing: 4px; line-height: 1; }
  .brand-title span { color: var(--red); }
  .progress-bar-wrap { width: 220px; height: 6px; background: var(--bg3); border: 1px solid var(--border); }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--orange)); transition: 0.5s; width: 0%; }

  /* LEGENDA ORIGINAL */
  .phase-legend { display: flex; gap: 20px; flex-wrap: wrap; padding: 16px 30px; border-bottom: 1px solid var(--border); }
  .legend-item { display: flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed'; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* MAIN E SIDEBAR */
  .main { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 200px); }
  .sidebar { border-right: 1px solid var(--border); padding: 30px 24px; position: sticky; top: 0; height: calc(100vh - 100px); overflow-y: auto; }

  /* NOVO: PAINEL APPLE GLASS */
  .glass-panel {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px; padding: 20px; margin-top: 25px; transition: 0.3s;
  }
  .glass-panel:hover { border-color: rgba(230, 48, 34, 0.4); transform: translateY(-3px); }

  /* CALENDÁRIO COM MESES SEPARADOS (ORIGINAL) */
  .calendar-area { padding: 30px; }
  .month-section { margin-bottom: 40px; }
  .month-label { font-family: 'Bebas Neue'; font-size: 32px; letter-spacing: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .month-label span { color: var(--red); }
  .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day-cell { aspect-ratio: 1; background: var(--bg2); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: 0.2s; }
  .day-cell.selected { border-color: var(--orange); background: rgba(255,107,26,0.1); }
  .day-cell.done { background: rgba(45,106,45,0.2); border-color: var(--done-text); }
  .day-num { font-family: 'Bebas Neue'; font-size: 22px; }
  .day-phase-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 3px; }

  .mark-btn { display: block; width: 100%; padding: 14px; background: var(--red); color: white; border: none; font-family: 'Bebas Neue'; font-size: 18px; cursor: pointer; margin-top: 15px; }
  .mark-btn.is-done { background: var(--done); color: var(--done-text); }
/* Efeito de Janela Modal estilo Apple */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); /* Fundo escuro */
    backdrop-filter: blur(10px); /* Desfoque sexy */
    -webkit-backdrop-filter: blur(10px);
    display: none; justify-content: center; align-items: center;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.4s ease;
}

.modal-content {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-radius: 30px; /* Bordas bem arredondadas Apple */
    padding: 40px;
    width: 90%; max-width: 450px;
    position: relative;
    transform: scale(0.7); /* Começa menor para o efeito de zoom */
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.modal-overlay.active { display: flex; opacity: 1; }
.modal-overlay.active .modal-content { transform: scale(1); } /* Zoom para o tamanho normal */

.close-modal {
    position: absolute; top: 20px; right: 25px;
    font-size: 28px; cursor: pointer; color: var(--gray);
    line-height: 1;
}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
    <div><div class="brand-title">ROAD TO<span> LAUNCH</span></div></div>
    <div style="text-align:right;">
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div style="font-family:'Bebas Neue'; margin-top:6px;"><span id="doneCount">0</span> / <span id="totalCount">0</span> DIAS</div>
    </div>
  </div>
</div>

<div class="phase-legend">
  <div class="legend-item"><div class="legend-dot" style="background:#e63022"></div> Fase 1</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff6b1a"></div> Fase 2</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f5c518"></div> Fase 3</div>
  <div class="legend-item"><div class="legend-dot" style="background:#1a9fff"></div> Fase 4</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5cdb5c"></div> Fase 5</div>
</div>

<div class="main">
  <div class="sidebar">
    <div id="selDayDate" style="font-family:'Bebas Neue'; font-size:48px; line-height:1;">--/--</div>
    <div id="selPhaseBadge" style="font-size:10px; color:var(--red); margin-top:5px; font-weight:bold;"></div>
    
    <textarea id="dayNotes" class="notes-input" placeholder="Notas da equipe..."></textarea>
    <button class="mark-btn" style="font-size:12px; background:var(--gray2);" onclick="saveData()">SALVAR NOTA</button>
    <button class="mark-btn" id="markBtn" onclick="toggleStatus()">MARCAR CONCLUÍDO</button>

    <div class="glass-panel">
      <div style="font-size:10px; color:var(--white); margin-bottom:12px; font-weight:bold; letter-spacing:1px;">ATIVIDADE RECENTE</div>
      <div id="recentActivity" style="font-size:11px; color:var(--gray);">Aguardando...</div>
    </div>
  </div>

  <div class="calendar-area" id="calendarArea"></div>
</div>

<script>
// --- CHAVES DO SUPABASE (COLOQUE AS SUAS AQUI) ---
const SB_URL = 'https://xebtpqjcpeatxkxmijgw.supabase.co'; 
const SB_KEY = ' sb_publishable_CxfVXlt7AwSAOQHDkRAS4Q_QmGM0H3z';
const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

const PHASES = {
  1: { start: '2026-05-12', end: '2026-05-25', color: '#e63022' },
  2: { start: '2026-05-26', end: '2026-06-08', color: '#ff6b1a' },
  3: { start: '2026-06-09', end: '2026-06-22', color: '#f5c518' },
  4: { start: '2026-06-23', end: '2026-07-07', color: '#1a9fff' },
  5: { start: '2026-07-08', end: '2026-07-12', color: '#5cdb5c' }
};

const MONTHS = [
  { name: 'MAI', month: 4, year: 2026 },
  { name: 'JUN', month: 5, year: 2026 },
  { name: 'JUL', month: 6, year: 2026 }
];

let selectedDate = '2026-05-12';
let dbData = {};

async function init() {
  await fetchAll();
  renderCalendar();
  selectDay(selectedDate);
  updateActivityPanel();
}

async function fetchAll() {
  const { data } = await supabaseClient.from('calendar_data').select('*');
  dbData = {};
  data?.forEach(d => dbData[d.date_id] = d);
}

function getPhase(ds) {
  for (let p in PHASES) {
    if (ds >= PHASES[p].start && ds <= PHASES[p].end) return p;
  }
  return null;
}

function renderCalendar() {
  const area = document.getElementById('calendarArea');
  area.innerHTML = '';
  let total = 0; let done = 0;

  MONTHS.forEach(m => {
    const section = document.createElement('div');
    section.className = 'month-section';
    section.innerHTML = `<div class="month-label">${m.name} <span>2026</span></div>`;
    
    const grid = document.createElement('div');
    grid.className = 'days-grid';
    
    const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${m.year}-${String(m.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const phase = getPhase(ds);
      if (!phase) continue;

      total++;
      const isDone = dbData[ds]?.is_done || false;
      if (isDone) done++;

      const cell = document.createElement('div');
      cell.className = `day-cell ${isDone ? 'done' : ''} ${selectedDate === ds ? 'selected' : ''}`;
      cell.innerHTML = `
        <div class="day-num">${d}</div>
        <div class="day-phase-dot" style="background:${PHASES[phase].color}"></div>
      `;
      cell.onclick = () => selectDay(ds);
      grid.appendChild(cell);
    }
    section.appendChild(grid);
    area.appendChild(section);
  });

  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('progressFill').style.width = (done/total*100) + '%';
}

function selectDay(ds) {
    selectedDate = ds;
    const data = dbData[ds] || { note_text: '', is_done: false };
    const phase = getPhase(ds);
    
    // 1. Preenche os dados na Janela (Modal)
    document.getElementById('modalDate').textContent = ds.split('-').reverse().slice(0,2).join('/');
    document.getElementById('modalPhase').textContent = phase ? `FASE ${phase}` : '';
    document.getElementById('modalNotesDisplay').textContent = data.note_text || "Nenhuma nota registrada para este dia.";
    
    // 2. Ajusta o botão da Modal
    const btn = document.getElementById('modalBtn');
    btn.textContent = data.is_done ? '✓ DIA CONCLUÍDO' : 'CONCLUIR DIA';
    btn.className = data.is_done ? 'mark-btn is-done' : 'mark-btn';

    // 3. Abre a animação sexy
    const modal = document.getElementById('dayModal');
    modal.classList.add('active');
    
    // Mantém a sidebar atualizada também
    document.getElementById('selDayDate').textContent = ds.split('-').reverse().slice(0,2).join('/');
}

// Função para fechar a janela
function closeDayModal() {
    document.getElementById('dayModal').classList.remove('active');
}

// Função para marcar como concluído de dentro da janela
async function toggleStatusFromModal() {
    await toggleStatus(); 
    closeDayModal();
}

async function saveData() {
  const note = document.getElementById('dayNotes').value;
  const isDone = dbData[selectedDate]?.is_done || false;
  await supabaseClient.from('calendar_data').upsert({ date_id: selectedDate, note_text: note, is_done: isDone });
  await fetchAll();
  renderCalendar();
  updateActivityPanel();
  alert("Nota salva!");
}

async function toggleStatus() {
  const current = dbData[selectedDate]?.is_done || false;
  await supabaseClient.from('calendar_data').upsert({ 
    date_id: selectedDate, is_done: !current, note_text: document.getElementById('dayNotes').value
  });
  await fetchAll();
  renderCalendar();
  selectDay(selectedDate);
  updateActivityPanel();
}

function updateActivityPanel() {
  const activityDiv = document.getElementById('recentActivity');
  const items = Object.values(dbData)
    .filter(d => d.note_text)
    .sort((a, b) => b.date_id.localeCompare(a.date_id))
    .slice(0, 2);

  if (items.length > 0) {
    activityDiv.innerHTML = items.map(i => `
      <div style="border-left:2px solid var(--red); padding-left:8px; margin-bottom:10px;">
        <div style="color:white; font-weight:bold;">DIA ${i.date_id.split('-').reverse().join('/')}</div>
        <div style="color:var(--gray); font-style:italic;">"${i.note_text.substring(0,25)}..."</div>
      </div>
    `).join('');
  }
}

init();
</script><div id="dayModal" class="modal-overlay" onclick="closeDayModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="closeDayModal()">&times;</span>
        <div id="modalDate" style="font-family:'Bebas Neue'; font-size: 52px; color: var(--red); line-height:1;">--/--</div>
        <div id="modalPhase" style="font-size: 11px; color: var(--gray); letter-spacing: 3px; margin-bottom: 25px; text-transform: uppercase;"></div>
        
        <div style="background: rgba(255,255,255,0.03); border-radius: 15px; padding: 20px; border: 1px solid rgba(255,255,255,0.05);">
            <div style="font-size: 10px; color: var(--red); margin-bottom: 10px; font-weight: bold; letter-spacing: 1px;">NOTAS DA EQUIPE:</div>
            <div id="modalNotesDisplay" style="font-family: 'Barlow Condensed'; font-size: 18px; color: var(--white); line-height: 1.4;"></div>
        </div>

        <button class="mark-btn" id="modalBtn" onclick="toggleStatusFromModal()" style="margin-top: 25px; border-radius: 12px;">MARCAR CONCLUÍDO</button>
    </div>
</div>
</body>
</html>
